[tools]
python = "latest"
git-cliff = "latest"
"aqua:asciinema/asciinema" = "latest"

[tasks.test]
description = "Run full test suite via uv"
run = "uv run pytest -v"

[tasks.demo]
description = "Record asciinema .cast and render animated SVG lifecycle demo"
run = "uv run python scripts/demo_lifecycle.py --record-cast docs/demo.cast --render-svg docs/demo.svg"

[tasks.bump]
description = "Bump version (patch|minor|major), update man page and lockfile, commit, and push"
run = "./scripts/bump.sh"

[tasks.release]
description = "Enforce clean synced tree, run tests & demo, build, tag (vX.Y.Z + latest), and publish GitHub Release"
run = "./scripts/release.sh"
