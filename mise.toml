[tools]
python = "latest"
git-cliff = "latest"
"aqua:asciinema/asciinema" = "latest"

[tasks.test]
description = "Run full test suite via uv"
run = "uv run pytest -v"

[tasks.demo]
description = "Record asciinema .cast and render animated SVG lifecycle demo"
run = "uv run python scripts/demo_lifecycle.py --record-cast docs/demo.cast --render-svg docs/demo.svg"

[tasks.release]
description = "Run tests, verify demo output, build wheel/sdist, tag, and publish GitHub Release"
run = """
set -euo pipefail
uv run pytest -v
uv run python scripts/demo_lifecycle.py -v --fast
rm -rf dist
uv build
VER=$(uv version --short)
TAG="v${VER}"
git tag -a "$TAG" -m "Release $TAG"
git push origin "$TAG"
git-cliff --current --strip header | gh release create "$TAG" dist/* --title "$TAG" --notes-file -
"""
