[project]
name = "private-journal"
version = "0.1.4"
description = "Single-user, 2FA-gated encrypted CLI journal with sandboxed nvim and transient search"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Pradyumna Chatterjee", email = "chatterjee.pra@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "click>=8.5.1",
    "cryptography>=50.0.2",
    "pyotp>=2.12.1",
]

[project.urls]
Repository = "https://github.com/pradyumnac/private-journal"

[project.scripts]
pj = "private_journal.cli:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
